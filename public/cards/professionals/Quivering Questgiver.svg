<text x="150" y="300" font-size="19" text-anchor="middle" fill="#2a1d10">Go on a Quest: roll 3 dice</text><text x="150" y="326" font-size="19" text-anchor="middle" fill="#2a1d10">and keep the best 2.</text><text x="150" y="400" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4630">Adventure awaits! Probably. I</text><text x="150" y="420" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4630">wouldn&apos;t go myself.</text></svg>