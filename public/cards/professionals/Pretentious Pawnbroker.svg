<text x="150" y="300" font-size="19" text-anchor="middle" fill="#2a1d10">Sell up to 2 resources</text><text x="150" y="326" font-size="19" text-anchor="middle" fill="#2a1d10">from your hoard to the</text><text x="150" y="352" font-size="19" text-anchor="middle" fill="#2a1d10">bank at their printed</text><text x="150" y="378" font-size="19" text-anchor="middle" fill="#2a1d10">value (no Rep).</text><text x="150" y="400" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4630">I suppose I could take it off</text><text x="150" y="420" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4630">your hands. For a pittance.</text></svg>