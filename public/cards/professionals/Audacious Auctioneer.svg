<text x="150" y="300" font-size="19" text-anchor="middle" fill="#2a1d10">Auction 2: auction up to 2</text><text x="150" y="326" font-size="19" text-anchor="middle" fill="#2a1d10">resources, one after the</text><text x="150" y="352" font-size="19" text-anchor="middle" fill="#2a1d10">other.</text><text x="150" y="400" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4630">Do I hear three? Three! From the</text><text x="150" y="420" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4630">gentleman with the suspicious</text><text x="150" y="440" font-size="14" font-style="italic" text-anchor="middle" fill="#5a4630">hat!</text></svg>